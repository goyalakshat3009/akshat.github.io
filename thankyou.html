<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas from Akshat</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@600&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background: radial-gradient(circle at top, #0b3d91, #000);
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    color:white;
    text-align:center;
}

/* Snow Effect */
.snow{
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://i.imgur.com/NM0xYlB.png");
    animation:snowfall 18s linear infinite;
    z-index:1;
}
@keyframes snowfall{
    0%{background-position:0 0;}
    100%{background-position:0 1200px;}
}

/* Fireworks */
.firework{
    position:absolute;
    width:6px;
    height:6px;
    background:gold;
    border-radius:50%;
    animation:explode 1.5s infinite;
}
@keyframes explode{
    0%{transform:scale(1); opacity:1;}
    100%{transform:scale(15); opacity:0;}
}

/* Main Content */
.container{
    position:relative;
    z-index:2;
    top:50%;
    transform:translateY(-50%);
}

/* Heading */
h1{
    font-size:4.2rem;
    color:#ffdf00;
    text-shadow:0 0 25px red, 0 0 45px green;
    animation:glow 2s infinite alternate;
}
@keyframes glow{
    from{ text-shadow:0 0 15px red;}
    to{ text-shadow:0 0 40px gold;}
}

/* Akshat Name Styles */
.akshat-box{
    margin:25px 0;
}

.akshat1{
    font-family:'Great Vibes', cursive;
    font-size:5.5rem;
    color:#00ffee;
    animation:float 3s ease-in-out infinite;
}

.akshat2{
    font-family:'Orbitron', sans-serif;
    font-size:2.8rem;
    letter-spacing:8px;
    color:#ff4d4d;
    text-shadow:0 0 20px red;
}

.akshat3{
    font-size:2rem;
    color:#7fff00;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0);}
}

/* Message Card */
.message{
    width:85%;
    max-width:650px;
    margin:25px auto;
    padding:25px;
    background:rgba(255,255,255,0.15);
    border-radius:25px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px rgba(255,255,255,0.3);
}

/* GIF */
.gif img{
    width:240px;
    border-radius:25px;
    box-shadow:0 0 25px red;
}

/* Button */
button{
    margin-top:20px;
    padding:12px 28px;
    font-size:1.1rem;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:linear-gradient(45deg, red, green);
    color:white;
    box-shadow:0 0 20px gold;
}

footer{
    position:absolute;
    bottom:15px;
    width:100%;
    font-size:1.1rem;
    color:#ffdede;
}
</style>
</head>

<body>

<div class="snow"></div>

<!-- Fireworks -->
<div class="firework" style="top:20%; left:30%;"></div>
<div class="firework" style="top:25%; left:70%;"></div>
<div class="firework" style="top:40%; left:50%;"></div>

<div class="container">
    <h1>🎄 Merry Christmas 🎄</h1>

    <div class="akshat-box">
        <div class="akshat1">Akshat</div>
        <div class="akshat2">AKSHAT</div>
        <div class="akshat3">✨ Wishes You Joy & Happiness ✨</div>
    </div>

    <div class="message">
        <p>
            May your Christmas be filled with  
            <b>love, laughter, warmth, and success</b>.  
            Let every light bring hope and every gift bring smiles. 🎁✨
        </p>
    </div>

    <div class="gif">
        <img src="https://media.giphy.com/media/xUOxfjsWnP2PtxkZUc/giphy.gif">
    </div>

    <button onclick="music.play()">🎵 Play Christmas Music</button>
</div>

<footer>
    🎅 With Love from <b>AKSHAT</b> 🎅
</footer>

<!-- Background Music -->
<audio id="music" loop>
    <source src="https://www.chosic.com/wp-content/uploads/2021/12/Jingle-Bells-Christmas-Song.mp3" type="audio/mpeg">
</audio>

<script>
let music = document.getElementById("music");
</script>

</body>
</html>
